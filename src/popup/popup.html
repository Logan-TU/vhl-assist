<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=360">
  <title>VHL Assist</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="popup">
    <!-- Header -->
    <header class="popup__header">
      <img src="../icons/icon48.png" alt="" class="popup__logo" width="24" height="24">
      <h1 class="popup__title">VHL Assist</h1>
    </header>

    <!-- Enable/Disable Toggle -->
    <section class="popup__section">
      <div class="popup__row">
        <span class="popup__label">Enable on VHL Central</span>
        <label class="toggle">
          <input type="checkbox" id="enableToggle" checked>
          <span class="toggle__slider"></span>
        </label>
      </div>
    </section>

    <!-- Info -->
    <section class="popup__section popup__section--status">
      <div class="popup__status">
        <span class="popup__status-text">
          Transcription powered by <strong>Whisper Small</strong> (~250 MB, downloaded on first use).
        </span>
      </div>
    </section>

    <!-- Footer -->
    <footer class="popup__footer">
      <a href="#" id="optionsLink" class="popup__link">Settings &amp; About</a>
    </footer>
  </div>

  <script type="module" src="popup.ts"></script>
</body>
</html>
